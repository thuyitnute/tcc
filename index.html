<html lang="vi">
<head>

    <script>

    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }
        .container {
            max-width: 850px;
            width: 100%;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 30px 35px;
            margin-top: 20px;
            margin-bottom: 40px;
        }
        h1 {
            text-align: center;
            color: #2c3e50;
            font-size: 28px;
            margin-bottom: 5px;
            border-bottom: 3px solid #764ba2;
            padding-bottom: 15px;
        }
        .subtitle {
            text-align: center;
            color: #7f8c8d;
            font-size: 14px;
            margin-bottom: 30px;
        }
        .question-card {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 22px 25px;
            margin-bottom: 25px;
            border-left: 5px solid #764ba2;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
            transition: all 0.3s ease;
        }
        .question-card.correct-highlight {
            border-left-color: #28a745;
            background: #f0fff4;
        }
        .question-number {
            display: inline-block;
            background: #764ba2;
            color: white;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 12px;
        }
        .question-text {
            font-size: 17px;
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 18px;
            line-height: 1.6;
        }
        .options {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .option {
            padding: 12px 18px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.25s ease;
            font-size: 15.5px;
            background: white;
            display: flex;
            align-items: center;
            gap: 12px;
            user-select: none;
        }
        .option:hover:not(.disabled) {
            border-color: #764ba2;
            background: #f3effa;
            transform: translateX(5px);
        }
        .option .label {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: #e0e0e0;
            font-weight: 700;
            font-size: 14px;
            color: #555;
            flex-shrink: 0;
            transition: all 0.25s ease;
        }
        .option.correct {
            border-color: #28a745 !important;
            background: #d4edda !important;
            color: #155724;
            font-weight: 600;
        }
        .option.correct .label {
            background: #28a745;
            color: white;
        }
        .option.incorrect {
            border-color: #dc3545 !important;
            background: #f8d7da !important;
            color: #721c24;
            font-weight: 600;
        }
        .option.incorrect .label {
            background: #dc3545;
            color: white;
        }
        .option.disabled {
            cursor: default;
        }
        .explanation {
            margin-top: 15px;
            padding: 15px 18px;
            border-radius: 10px;
            font-size: 15px;
            line-height: 1.7;
            display: none;
            border-left: 4px solid #17a2b8;
            background: #e8f4f8;
            color: #0c5460;
        }
        .explanation.show {
            display: block;
            animation: fadeIn 0.4s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .explanation strong {
            color: #0c5460;
        }
        .score-board {
            position: sticky;
            bottom: 20px;
            background: white;
            border-radius: 15px;
            padding: 15px 25px;
            box-shadow: 0 -5px 20px rgba(0,0,0,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            border: 2px solid #764ba2;
            z-index: 100;
        }
        .score-text {
            font-size: 18px;
            font-weight: 700;
            color: #2c3e50;
        }
        .score-text span {
            color: #764ba2;
            font-size: 22px;
        }
        .btn-reset {
            background: #764ba2;
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 25px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;

        }
        .btn-reset:hover {
            background: #5a3a7a;
            transform: scale(1.05);
        }
        .completed-badge {
            display: none;
            text-align: center;
            padding: 12px;
            background: #d4edda;
            color: #155724;
            border-radius: 10px;
            font-weight: 600;
            margin-top: 10px;
            font-size: 16px;
        }
        .completed-badge.show {
            display: block;
        }
        @media (max-width: 600px) {
            .container { padding: 18px; }
            h1 { font-size: 22px; }
            .question-text { font-size: 15.5px; }
            .option { font-size: 14px; padding: 10px 14px; }
            .score-board { flex-direction: column; gap: 10px; }
        }
    </style>

<body>
    <div class="container">
        <h1>⚛️ Trắc nghiệm Vật lý: Lực ma sát</h1>
        <p class="subtitle">Chọn đáp án đúng — 10 câu hỏi</p>

        <div id="quiz-container"></div>

        <div class="completed-badge" id="completedBadge">🎉 Chúc mừng! Bạn đã hoàn thành tất cả câu hỏi.</div>

        <div class="score-board">
            <div class="score-text">Điểm: <span id="score">0</span> / 10</div>
            <button class="btn-reset" onclick="resetQuiz()">🔄 Làm lại</button>
        </div>
    </div>

    <script>
        // ==================== NGÂN HÀNG CÂU HỎI ====================
        const questions = [
            {
                question: "Lực ma sát trượt xuất hiện khi nào?",
                options: [
                    "Khi một vật đứng yên trên mặt phẳng nằm ngang.",
                    "Khi một vật trượt trên bề mặt của một vật khác.",
                    "Khi một vật rơi tự do trong không khí.",
                    "Khi một vật được treo vào lò xo."
                ],
                correct: 1, // index của đáp án đúng (0-based)
                explanation: "<strong>Đáp án đúng: B.</strong> Lực ma sát trượt xuất hiện khi một vật trượt trên bề mặt của vật khác, có tác dụng cản trở chuyển động trượt. Công thức tính độ lớn: $F_{mst} = \\mu_t \\cdot N$, trong đó $\\mu_t$ là hệ số ma sát trượt, $N$ là áp lực lên mặt tiếp xúc. <br><br><em>Giải thích các đáp án khác:</em><br>• A: Vật đứng yên có thể có ma sát nghỉ, không phải ma sát trượt.<br>• C: Vật rơi tự do chịu lực cản của không khí (khác bản chất với ma sát trượt trên bề mặt rắn).<br>• D: Vật treo vào lò xo đứng yên chịu lực đàn hồi, không có ma sát trượt."
            },
            {
                question: "Độ lớn của lực ma sát trượt phụ thuộc vào yếu tố nào sau đây?",
                options: [
                    "Diện tích tiếp xúc giữa hai bề mặt.",
                    "Tốc độ chuyển động của vật.",
                    "Áp lực lên mặt tiếp xúc và hệ số ma sát trượt.",
                    "Khối lượng riêng của vật liệu làm bề mặt."
                ],
                correct: 2,
                explanation: "<strong>Đáp án đúng: C.</strong> Theo công thức $F_{mst} = \\mu_t \\cdot N$, độ lớn lực ma sát trượt phụ thuộc vào hệ số ma sát trượt $\\mu_t$ (phụ thuộc vật liệu và tình trạng bề mặt) và áp lực $N$ lên mặt tiếp xúc. <br><br><em>Giải thích các đáp án khác:</em><br>• A: Diện tích tiếp xúc không ảnh hưởng đến độ lớn lực ma sát trượt trong mô hình lý tưởng.<br>• B: Tốc độ không ảnh hưởng đến độ lớn lực ma sát trượt (trong phạm vi thông thường).<br>• D: Khối lượng riêng không trực tiếp quyết định độ lớn lực ma sát."
            },
            {
                question: "Một vật có khối lượng $m = 5\\,kg$ trượt đều trên mặt phẳng ngang. Hệ số ma sát trượt giữa vật và mặt phẳng là $\\mu_t = 0{,}2$. Lấy $g = 10\\,m/s^2$. Độ lớn lực ma sát trượt tác dụng lên vật là bao nhiêu?",
                options: [
                    "$F_{mst} = 1\\,N$",
                    "$F_{mst} = 10\\,N$",
                    "$F_{mst} = 5\\,N$",
                    "$F_{mst} = 50\\,N$"
                ],
                correct: 1,
                explanation: "<strong>Đáp án đúng: B.</strong> Vì vật trượt trên mặt phẳng ngang, áp lực $N = P = mg = 5 \\times 10 = 50\\,N$.<br>Lực ma sát trượt: $F_{mst} = \\mu_t \\cdot N = 0{,}2 \\times 50 = 10\\,N$.<br><br><em>Giải thích các đáp án khác:</em><br>• A: Sai do nhầm $F = \\mu_t \\cdot m = 0{,}2 \\times 5 = 1\\,N$ (thiếu $g$).<br>• C: Sai do nhầm $F = m = 5\\,N$.<br>• D: Sai do lấy $N = 50\\,N$ nhưng quên nhân $\\mu_t$."
            },
            {
                question: "Lực ma sát nghỉ có đặc điểm nào sau đây?",
                options: [
                    "Luôn có độ lớn bằng $\\mu_n \\cdot N$.",
                    "Xuất hiện khi vật có xu hướng chuyển động nhưng chưa chuyển động.",
                    "Luôn ngược chiều với trọng lực.",
                    "Chỉ xuất hiện khi vật đặt trên mặt phẳng nghiêng."
                ],
                correct: 1,
                explanation: "<strong>Đáp án đúng: B.</strong> Lực ma sát nghỉ xuất hiện khi có ngoại lực tác dụng làm vật có xu hướng chuyển động nhưng vật vẫn chưa chuyển động. Độ lớn của nó bằng độ lớn ngoại lực thành phần song song với mặt tiếp xúc và có giá trị cực đại $F_{msn}^{max} = \\mu_n \\cdot N$.<br><br><em>Giải thích các đáp án khác:</em><br>• A: Chỉ khi ma sát nghỉ đạt cực đại mới bằng $\\mu_n \\cdot N$, bình thường nó nhỏ hơn.<br>• C: Ma sát nghỉ ngược chiều với xu hướng chuyển động, không nhất thiết ngược chiều trọng lực.<br>• D: Ma sát nghỉ cũng xuất hiện trên mặt phẳng ngang khi có lực đẩy ngang."
            },
            {
                question: "Một vật đặt trên mặt phẳng nghiêng góc $\\alpha = 30^\\circ$ so với phương ngang. Hệ số ma sát nghỉ cực đại giữa vật và mặt phẳng là $\\mu_n = 0{,}5$. Lấy $g = 10\\,m/s^2$. Điều kiện nào sau đây đúng để vật không trượt xuống?",
                options: [
                    "$\\tan\\alpha \\leq \\mu_n$",
                    "$\\tan\\alpha \\geq \\mu_n$",
                    "$\\sin\\alpha \\leq \\mu_n$",
                    "$\\cos\\alpha \\leq \\mu_n$"
                ],
                correct: 0,
                explanation: "<strong>Đáp án đúng: A.</strong> Để vật không trượt xuống trên mặt phẳng nghiêng, thành phần trọng lực song song mặt phẳng $P_{\\parallel} = mg\\sin\\alpha$ không được vượt quá ma sát nghỉ cực đại $F_{msn}^{max} = \\mu_n \\cdot N = \\mu_n mg\\cos\\alpha$.<br>Tức là: $mg\\sin\\alpha \\leq \\mu_n mg\\cos\\alpha \\Rightarrow \\tan\\alpha \\leq \\mu_n$.<br>Với $\\alpha = 30^\\circ$, $\\tan 30^\\circ \\approx 0{,}577 > 0{,}5$, nên thực tế vật sẽ trượt xuống.<br><br><em>Giải thích các đáp án khác:</em><br>• B: Đây là điều kiện để vật trượt xuống.<br>• C, D: Sai vì không phải điều kiện cân bằng lực đúng."
            },
            {
                question: "Lực ma sát lăn có đặc điểm gì so với lực ma sát trượt?",
                options: [
                    "Lực ma sát lăn luôn lớn hơn lực ma sát trượt.",
                    "Lực ma sát lăn thường nhỏ hơn lực ma sát trượt rất nhiều.",
                    "Lực ma sát lăn không phụ thuộc vào áp lực.",
                    "Lực ma sát lăn chỉ xuất hiện khi vật quay tại chỗ."
                ],
                correct: 1,
                explanation: "<strong>Đáp án đúng: B.</strong> Lực ma sát lăn xuất hiện khi một vật lăn trên bề mặt vật khác, và hệ số ma sát lăn thường nhỏ hơn hệ số ma sát trượt rất nhiều lần. Đó là lý do người ta dùng bánh xe, ổ bi để giảm ma sát.<br><br><em>Giải thích các đáp án khác:</em><br>• A: Sai, ma sát lăn nhỏ hơn ma sát trượt.<br>• C: Sai, ma sát lăn vẫn phụ thuộc vào áp lực $N$.<br>• D: Sai, ma sát lăn xuất hiện khi vật vừa lăn vừa chuyển động tịnh tiến."
            },
            {
                question: "Một ô tô khối lượng $1{,}5$ tấn chuyển động thẳng đều trên đường nằm ngang. Hệ số ma sát lăn giữa bánh xe và mặt đường là $0{,}02$. Lấy $g = 10\\,m/s^2$. Lực phát động của động cơ bằng bao nhiêu?",
                options: [
                    "$F = 300\\,N$",
                    "$F = 1500\\,N$",
                    "$F = 3000\\,N$",
                    "$F = 150\\,N$"
                ],
                correct: 0,
                explanation: "<strong>Đáp án đúng: A.</strong> Đổi $m = 1{,}5$ tấn $= 1500\\,kg$.<br>Vì ô tô chuyển động thẳng đều, lực phát động cân bằng với lực ma sát lăn: $F = F_{msl} = \\mu_l \\cdot N = \\mu_l \\cdot mg$.<br>$F = 0{,}02 \\times 1500 \\times 10 = 300\\,N$.<br><br><em>Giải thích các đáp án khác:</em><br>• B: Sai do nhầm $F = m = 1500\\,N$.<br>• C: Sai do nhầm $F = 2mg = 3000\\,N$.<br>• D: Sai do nhầm $F = 0{,}01mg = 150\\,N$."
            },
            {
                question: "Yếu tố nào sau đây làm tăng lực ma sát trượt?",
                options: [
                    "Làm nhẵn bề mặt tiếp xúc.",
                    "Tăng áp lực lên bề mặt tiếp xúc.",
                    "Bôi trơn bề mặt tiếp xúc.",
                    "Giảm khối lượng của vật."
                ],
                correct: 1,
                explanation: "<strong>Đáp án đúng: B.</strong> Theo công thức $F_{mst} = \\mu_t \\cdot N$, khi tăng áp lực $N$ lên mặt tiếp xúc thì lực ma sát trượt tăng.<br><br><em>Giải thích các đáp án khác:</em><br>• A: Làm nhẵn bề mặt làm giảm hệ số ma sát $\\mu_t$, do đó giảm lực ma sát.<br>• C: Bôi trơn làm giảm mạnh hệ số ma sát.<br>• D: Giảm khối lượng làm giảm áp lực $N$, do đó giảm lực ma sát."
            },
            {
                question: "Trong các trường hợp sau, trường hợp nào lực ma sát có lợi?",
                options: [
                    "Ma sát giữa đế giày và mặt đường khi đi bộ.",
                    "Ma sát giữa xích và đĩa xe đạp.",
                    "Ma sát giữa trục quay và ổ trục.",
                    "Ma sát giữa pít-tông và xi-lanh động cơ."
                ],
                correct: 0,
                explanation: "<strong>Đáp án đúng: A.</strong> Ma sát giữa đế giày và mặt đường là có lợi vì nó giúp ta bám đường, không bị trượt ngã khi đi lại.<br><br><em>Giải thích các đáp án khác:</em><br>• B: Ma sát giữa xích và đĩa xe đạp gây mài mòn, có hại.<br>• C: Ma sát ở trục quay và ổ trục gây cản trở chuyển động, có hại.<br>• D: Ma sát giữa pít-tông và xi-lanh gây mài mòn, giảm hiệu suất động cơ, có hại."
            },
            {
                question: "Một vật khối lượng $m = 2\\,kg$ bắt đầu trượt xuống trên mặt phẳng nghiêng góc $\\alpha = 45^\\circ$. Hệ số ma sát trượt $\\mu_t = 0{,}1$. Lấy $g = 10\\,m/s^2$. Gia tốc của vật là bao nhiêu?",
                options: [
                    "$a \\approx 6{,}4\\,m/s^2$",
                    "$a \\approx 7{,}1\\,m/s^2$",
                    "$a \\approx 5{,}0\\,m/s^2$",
                    "$a \\approx 8{,}2\\,m/s^2$"
                ],
                correct: 0,
                explanation: "<strong>Đáp án đúng: A.</strong> Chọn trục Ox dọc theo mặt phẳng nghiêng hướng xuống.<br>Thành phần trọng lực kéo vật xuống: $P_{\\parallel} = mg\\sin\\alpha$.<br>Lực ma sát trượt ngược chiều chuyển động: $F_{mst} = \\mu_t \\cdot N = \\mu_t mg\\cos\\alpha$.<br>Theo định luật II Newton: $ma = mg\\sin\\alpha - \\mu_t mg\\cos\\alpha$<br>$\\Rightarrow a = g(\\sin\\alpha - \\mu_t\\cos\\alpha) = 10(\\sin 45^\\circ - 0{,}1 \\cdot \\cos 45^\\circ)$<br>$= 10 \\times \\frac{\\sqrt{2}}{2}(1 - 0{,}1) = 10 \\times 0{,}707 \\times 0{,}9 \\approx 6{,}36 \\approx 6{,}4\\,m/s^2$.<br><br><em>Giải thích các đáp án khác:</em><br>• B: Sai do bỏ qua ma sát: $a = g\\sin 45^\\circ \\approx 7{,}07\\,m/s^2$.<br>• C, D: Sai do tính toán nhầm hệ số."
            }
        ];

        // ==================== BIẾN TOÀN CỤC ====================
        let score = 0;
        let answeredCount = 0;
        const totalQuestions = questions.length;
        const userAnswers = new Array(totalQuestions).fill(null); // lưu index đáp án đã chọn

        // ==================== KHỞI TẠO GIAO DIỆN ====================
        function renderQuiz() {
            const container = document.getElementById('quiz-container');
            container.innerHTML = '';

            questions.forEach((q, qIndex) => {
                const card = document.createElement('div');
                card.className = 'question-card';
                card.id = `question-${qIndex}`;

                // Số thứ tự câu hỏi
                const numberBadge = document.createElement('div');
                numberBadge.className = 'question-number';
                numberBadge.textContent = `Câu ${qIndex + 1}`;
                card.appendChild(numberBadge);

                // Nội dung câu hỏi
                const qText = document.createElement('div');
                qText.className = 'question-text';
                qText.innerHTML = q.question;
                card.appendChild(qText);

                // Các lựa chọn
                const optionsDiv = document.createElement('div');
                optionsDiv.className = 'options';

                q.options.forEach((opt, oIndex) => {
                    const optDiv = document.createElement('div');
                    optDiv.className = 'option';
                    optDiv.dataset.qIndex = qIndex;
                    optDiv.dataset.oIndex = oIndex;

                    const label = document.createElement('span');
                    label.className = 'label';
                    label.textContent = String.fromCharCode(65 + oIndex); // A, B, C, D

                    const optText = document.createElement('span');
                    optText.className = 'option-text';
                    optText.innerHTML = opt;

                    optDiv.appendChild(label);
                    optDiv.appendChild(optText);

                    optDiv.addEventListener('click', () => handleAnswer(qIndex, oIndex));
                    optionsDiv.appendChild(optDiv);
                });

                card.appendChild(optionsDiv);

                // Phần giải thích
                const explanationDiv = document.createElement('div');
                explanationDiv.className = 'explanation';
                explanationDiv.id = `explanation-${qIndex}`;
                explanationDiv.innerHTML = q.explanation;
                card.appendChild(explanationDiv);

                container.appendChild(card);
            });

            // Render lại MathJax sau khi thêm nội dung
            if (window.MathJax && MathJax.typesetPromise) {
                MathJax.typesetPromise().catch((err) => console.log('MathJax error:', err));
            }
        }

        // ==================== XỬ LÝ CHỌN ĐÁP ÁN ====================
        function handleAnswer(qIndex, oIndex) {
            // Nếu đã trả lời câu này rồi thì bỏ qua
            if (userAnswers[qIndex] !== null) return;

            const q = questions[qIndex];
            const isCorrect = (oIndex === q.correct);

            // Lưu câu trả lời
            userAnswers[qIndex] = oIndex;
            answeredCount++;

            // Cập nhật điểm
            if (isCorrect) {
                score++;
                document.getElementById('score').textContent = score;
            }

            // Lấy tất cả các option của câu hỏi này
            const card = document.getElementById(`question-${qIndex}`);
            const allOptions = card.querySelectorAll('.option');

            // Vô hiệu hóa tất cả các lựa chọn
            allOptions.forEach(opt => {
                opt.classList.add('disabled');
                const oIdx = parseInt(opt.dataset.oIndex);
                if (oIdx === q.correct) {
                    opt.classList.add('correct');
                } else if (oIdx === oIndex && !isCorrect) {
                    opt.classList.add('incorrect');
                }
            });

            // Nếu chọn đúng, thêm highlight cho card
            if (isCorrect) {
                card.classList.add('correct-highlight');
            }

            // Hiện giải thích
            const explanation = document.getElementById(`explanation-${qIndex}`);
            explanation.classList.add('show');

            // Render lại MathJax cho phần giải thích vừa hiện
            if (window.MathJax && MathJax.typesetPromise) {
                MathJax.typesetPromise([explanation]).catch((err) => console.log('MathJax error:', err));
            }

            // Kiểm tra hoàn thành
            if (answeredCount === totalQuestions) {
                document.getElementById('completedBadge').classList.add('show');
            }
        }

        // ==================== RESET ====================
        function resetQuiz() {
            score = 0;
            answeredCount = 0;
            userAnswers.fill(null);
            document.getElementById('score').textContent = '0';
            document.getElementById('completedBadge').classList.remove('show');
            renderQuiz();
        }

        // ==================== KHỞI CHẠY ====================
        document.addEventListener('DOMContentLoaded', () => {
            renderQuiz();
        });
    </script>
</body>
</html>
