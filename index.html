    <script>
        // ==================== NGÂN HÀNG 30 CÂU HỎI ====================
        const questions = [
            // ===== CẤP ĐỘ DỄ (10 câu) =====
            {
                difficulty: "Dễ",
                question: "Cho ma trận $A = \\begin{bmatrix} 1 & 2 \\\\ 3 & 4 \\end{bmatrix}$. Phần tử $a_{21}$ của ma trận $A$ bằng bao nhiêu?",
                options: ["$a_{21} = 1$", "$a_{21} = 2$", "$a_{21} = 3$", "$a_{21} = 4$"],
                correct: 2,
                explanation: "<strong>Đáp án đúng: C.</strong> Phần tử $a_{ij}$ nằm ở giao điểm của hàng $i$ và cột $j$. Vậy $a_{21}$ là phần tử ở hàng 2, cột 1 của ma trận $A$, tức là $a_{21} = 3$.<br><br><em>Giải thích các đáp án khác:</em><br>• A: $a_{11} = 1$ (hàng 1, cột 1).<br>• B: $a_{12} = 2$ (hàng 1, cột 2).<br>• D: $a_{22} = 4$ (hàng 2, cột 2)."
            },
            {
                difficulty: "Dễ",
                question: "Ma trận $A = \\begin{bmatrix} 1 & 0 & 0 \\\\ 0 & 1 & 0 \\\\ 0 & 0 & 1 \\end{bmatrix}$ được gọi là gì?",
                options: ["Ma trận không", "Ma trận đơn vị", "Ma trận chéo", "Cả B và C đều đúng"],
                correct: 3,
                explanation: "<strong>Đáp án đúng: D.</strong> Ma trận này vừa là ma trận đơn vị (các phần tử trên đường chéo chính bằng 1, còn lại bằng 0), vừa là ma trận chéo (các phần tử ngoài đường chéo chính bằng 0).<br><br><em>Giải thích các đáp án khác:</em><br>• A: Ma trận không có tất cả các phần tử bằng 0.<br>• B: Đúng nhưng chưa đầy đủ.<br>• C: Đúng nhưng chưa đầy đủ."
            },
            {
                difficulty: "Dễ",
                question: "Cho $A = \\begin{bmatrix} 1 & 2 \\\\ 3 & 4 \\end{bmatrix}$ và $B = \\begin{bmatrix} 5 & 6 \\\\ 7 & 8 \\end{bmatrix}$. Tính $A + B$.",
                options: [
                    "$\\begin{bmatrix} 6 & 8 \\\\ 10 & 12 \\end{bmatrix}$",
                    "$\\begin{bmatrix} 5 & 12 \\\\ 21 & 32 \\end{bmatrix}$",
                    "$\\begin{bmatrix} 4 & 4 \\\\ 4 & 4 \\end{bmatrix}$",
                    "$\\begin{bmatrix} 6 & 10 \\\\ 8 & 12 \\end{bmatrix}$"
                ],
                correct: 0,
                explanation: "<strong>Đáp án đúng: A.</strong> Phép cộng hai ma trận cùng cấp được thực hiện bằng cách cộng từng phần tử tương ứng:<br>$$A + B = \\begin{bmatrix} 1+5 & 2+6 \\\\ 3+7 & 4+8 \\end{bmatrix} = \\begin{bmatrix} 6 & 8 \\\\ 10 & 12 \\end{bmatrix}$$<br><br><em>Giải thích các đáp án khác:</em><br>• B: Đây là kết quả của phép nhân Hadamard (nhân từng phần tử).<br>• C: Sai hoàn toàn.<br>• D: Sai vị trí các phần tử."
            },
            {
                difficulty: "Dễ",
                question: "Cho ma trận $A = \\begin{bmatrix} 2 & -1 \\\\ 3 & 4 \\end{bmatrix}$. Tính định thức $\\det(A)$.",
                options: ["$\\det(A) = 5$", "$\\det(A) = 11$", "$\\det(A) = 8$", "$\\det(A) = -5$"],
                correct: 1,
                explanation: "<strong>Đáp án đúng: B.</strong> Với ma trận cấp 2 $A = \\begin{bmatrix} a & b \\\\ c & d \\end{bmatrix}$, định thức được tính bởi $\\det(A) = ad - bc$.<br>Áp dụng: $\\det(A) = 2 \\cdot 4 - (-1) \\cdot 3 = 8 + 3 = 11$.<br><br><em>Giải thích các đáp án khác:</em><br>• A: Sai do tính nhầm $2 \\cdot 4 - 3 = 5$.<br>• C: Sai do quên dấu trừ.<br>• D: Sai dấu."
            },
            {
                difficulty: "Dễ",
                question: "Ma trận chuyển vị của $A = \\begin{bmatrix} 1 & 2 & 3 \\\\ 4 & 5 & 6 \\end{bmatrix}$ là:",
                options: [
                    "$\\begin{bmatrix} 1 & 4 \\\\ 2 & 5 \\\\ 3 & 6 \\end{bmatrix}$",
                    "$\\begin{bmatrix} 1 & 2 & 3 \\\\ 4 & 5 & 6 \\end{bmatrix}$",
                    "$\\begin{bmatrix} 6 & 5 & 4 \\\\ 3 & 2 & 1 \\end{bmatrix}$",
                    "$\\begin{bmatrix} 1 & 2 \\\\ 3 & 4 \\\\ 5 & 6 \\end{bmatrix}$"
                ],
                correct: 0,
                explanation: "<strong>Đáp án đúng: A.</strong> Ma trận chuyển vị $A^t$ được tạo bằng cách đổi hàng thành cột, cột thành hàng. Ma trận $A$ cỡ $2 \\times 3$ nên $A^t$ cỡ $3 \\times 2$:<br>$$A^t = \\begin{bmatrix} 1 & 4 \\\\ 2 & 5 \\\\ 3 & 6 \\end{bmatrix}$$<br><br><em>Giải thích các đáp án khác:</em><br>• B: Không đổi gì cả.<br>• C: Đây không phải là chuyển vị.<br>• D: Sai kích thước."
            },
            {
                difficulty: "Dễ",
                question: "Ma trận không cấp $2 \\times 3$ là ma trận:",
                options: [
                    "$\\begin{bmatrix} 0 & 0 \\\\ 0 & 0 \\end{bmatrix}$",
                    "$\\begin{bmatrix} 0 & 0 & 0 \\\\ 0 & 0 & 0 \\end{bmatrix}$",
                    "$\\begin{bmatrix} 0 & 0 \\\\ 0 & 0 \\\\ 0 & 0 \\end{bmatrix}$",
                    "$\\begin{bmatrix} 1 & 0 & 0 \\\\ 0 & 1 & 0 \\end{bmatrix}$"
                ],
                correct: 1,
                explanation: "<strong>Đáp án đúng: B.</strong> Ma trận không cấp $m \\times n$ là ma trận có $m$ hàng, $n$ cột và tất cả các phần tử bằng 0. Vậy ma trận không cấp $2 \\times 3$ có 2 hàng, 3 cột.<br><br><em>Giải thích các đáp án khác:</em><br>• A: Cấp $2 \\times 2$.<br>• C: Cấp $3 \\times 2$.<br>• D: Không phải ma trận không (có phần tử bằng 1)."
            },
            {
                difficulty: "Dễ",
                question: "Cho $A = \\begin{bmatrix} 1 & 2 \\\\ 3 & 4 \\end{bmatrix}$. Tính $2A$.",
                options: [
                    "$\\begin{bmatrix} 2 & 4 \\\\ 6 & 8 \\end{bmatrix}$",
                    "$\\begin{bmatrix} 1 & 4 \\\\ 9 & 4 \\end{bmatrix}$",
                    "$\\begin{bmatrix} 2 & 2 \\\\ 3 & 8 \\end{bmatrix}$",
                    "$\\begin{bmatrix} 3 & 4 \\\\ 5 & 6 \\end{bmatrix}$"
                ],
                correct: 0,
                explanation: "<strong>Đáp án đúng: A.</strong> Phép nhân ma trận với một số thực $k$ được thực hiện bằng cách nhân từng phần tử của ma trận với $k$:<br>$$2A = 2 \\begin{bmatrix} 1 & 2 \\\\ 3 & 4 \\end{bmatrix} = \\begin{bmatrix} 2 & 4 \\\\ 6 & 8 \\end{bmatrix}$$<br><br><em>Giải thích các đáp án khác:</em><br>• B, C, D: Đều là kết quả của việc nhân sai vị trí."
            },
            {
                difficulty: "Dễ",
                question: "Hai ma trận $A$ và $B$ được gọi là bằng nhau khi và chỉ khi:",
                options: [
                    "Chúng có cùng số hàng.",
                    "Chúng có cùng số cột.",
                    "Chúng cùng cỡ và các phần tử tương ứng bằng nhau.",
                    "Chúng có cùng định thức."
                ],
                correct: 2,
                explanation: "<strong>Đáp án đúng: C.</strong> Hai ma trận $A = [a_{ij}]_{m \\times n}$ và $B = [b_{ij}]_{m \\times n}$ được gọi là bằng nhau nếu chúng cùng cỡ và $a_{ij} = b_{ij}$ với mọi $i, j$.<br><br><em>Giải thích các đáp án khác:</em><br>• A, B: Chỉ cùng số hàng hoặc cùng số cột là chưa đủ.<br>• D: Cùng định thức không đảm bảo hai ma trận bằng nhau."
            },
            {
                difficulty: "Dễ",
                question: "Ma trận tam giác trên là ma trận vuông có:",
                options: [
                    "Tất cả các phần tử nằm trên đường chéo chính bằng 0.",
                    "Tất cả các phần tử nằm dưới đường chéo chính bằng 0.",
                    "Tất cả các phần tử nằm ngoài đường chéo chính bằng 0.",
                    "Tất cả các phần tử đều bằng 0."
                ],
                correct: 1,
                explanation: "<strong>Đáp án đúng: B.</strong> Ma trận tam giác trên là ma trận vuông cấp $n$ mà tất cả các phần tử nằm dưới đường chéo chính đều bằng 0, tức là $a_{ij} = 0$ nếu $i > j$.<br><br><em>Giải thích các đáp án khác:</em><br>• A: Đây là ma trận tam giác dưới.<br>• C: Đây là ma trận chéo.<br>• D: Đây là ma trận không."
            },
            {
                difficulty: "Dễ",
                question: "Định thức của ma trận đơn vị cấp $n$ bằng bao nhiêu?",
                options: ["$0$", "$1$", "$n$", "$-1$"],
                correct: 1,
                explanation: "<strong>Đáp án đúng: B.</strong> Ma trận đơn vị $I_n$ có các phần tử trên đường chéo chính bằng 1, còn lại bằng 0. Vì là ma trận tam giác (vừa trên vừa dưới), định thức bằng tích các phần tử trên đường chéo chính: $\\det(I_n) = 1 \\cdot 1 \\cdots 1 = 1$.<br><br><em>Giải thích các đáp án khác:</em><br>• A, C, D: Đều sai."
            },

            // ===== CẤP ĐỘ TRUNG BÌNH (12 câu) =====
            {
                difficulty: "Trung bình",
                question: "Cho $A = \\begin{bmatrix} 1 & 2 \\\\ 3 & 4 \\end{bmatrix}$ và $B = \\begin{bmatrix} 0 & 1 \\\\ 1 & 0 \\end{bmatrix}$. Tính tích $AB$.",
                options: [
                    "$AB = \\begin{bmatrix} 2 & 1 \\\\ 4 & 3 \\end{bmatrix}$",
                    "$AB = \\begin{bmatrix} 0 & 2 \\\\ 3 & 0 \\end{bmatrix}$",
                    "$AB = \\begin{bmatrix} 3 & 4 \\\\ 1 & 2 \\end{bmatrix}$",
                    "$AB = \\begin{bmatrix} 1 & 2 \\\\ 4 & 3 \\end{bmatrix}$"
                ],
                correct: 0,
                explanation: "<strong>Đáp án đúng: A.</strong> Nhân hai ma trận theo quy tắc \"hàng nhân cột\":<br>$$AB = \\begin{bmatrix} 1 & 2 \\\\ 3 & 4 \\end{bmatrix} \\begin{bmatrix} 0 & 1 \\\\ 1 & 0 \\end{bmatrix} = \\begin{bmatrix} 1\\cdot0+2\\cdot1 & 1\\cdot1+2\\cdot0 \\\\ 3\\cdot0+4\\cdot1 & 3\\cdot1+4\\cdot0 \\end{bmatrix} = \\begin{bmatrix} 2 & 1 \\\\ 4 & 3 \\end{bmatrix}$$<br><br><em>Giải thích các đáp án khác:</em><br>• B, C, D: Đều là kết quả của việc nhân sai vị trí hàng/cột."
            },
            {
                difficulty: "Trung bình",
                question: "Ma trận nghịch đảo của $A = \\begin{bmatrix} 2 & 1 \\\\ 5 & 3 \\end{bmatrix}$ là:",
                options: [
                    "$A^{-1} = \\begin{bmatrix} 3 & -1 \\\\ -5 & 2 \\end{bmatrix}$",
                    "$A^{-1} = \\begin{bmatrix} 3 & 1 \\\\ 5 & 2 \\end{bmatrix}$",
                    "$A^{-1} = \\begin{bmatrix} -3 & 1 \\\\ 5 & -2 \\end{bmatrix}$",
                    "$A^{-1} = \\begin{bmatrix} 2 & -1 \\\\ -5 & 3 \\end{bmatrix}$"
                ],
                correct: 0,
                explanation: "<strong>Đáp án đúng: A.</strong> Với ma trận cấp 2 $A = \\begin{bmatrix} a & b \\\\ c & d \\end{bmatrix}$, nếu $\\det(A) = ad - bc \\neq 0$ thì:<br>$$A^{-1} = \\frac{1}{ad-bc} \\begin{pmatrix} d & -b \\\\ -c & a \\end{pmatrix}$$<br>Ở đây $\\det(A) = 2\\cdot3 - 1\\cdot5 = 1$. Do đó:<br>$$A^{-1} = \\begin{bmatrix} 3 & -1 \\\\ -5 & 2 \\end{bmatrix}$$<br><br><em>Giải thích các đáp án khác:</em><br>• B, D: Sai vị trí dấu.<br>• C: Sai dấu toàn bộ."
            },
            {
                difficulty: "Trung bình",
                question: "Ma trận $A = \\begin{bmatrix} 1 & 2 & 3 \\\\ 2 & 4 & 6 \\\\ 1 & 1 & 1 \\end{bmatrix}$ có hạng bằng bao nhiêu?",
                options: ["$\\text{rank}(A) = 1$", "$\\text{rank}(A) = 2$", "$\\text{rank}(A) = 3$", "$\\text{rank}(A) = 0$"],
                correct: 1,
                explanation: "<strong>Đáp án đúng: B.</strong> Ta thấy hàng 2 bằng 2 lần hàng 1 ($R_2 = 2R_1$), nên hai hàng này phụ thuộc tuyến tính. Do đó hạng tối đa chỉ có thể là 2.<br>Xét hai hàng $R_1 = (1, 2, 3)$ và $R_3 = (1, 1, 1)$: chúng không tỉ lệ, nên độc lập tuyến tính.<br>Vậy $\\text{rank}(A) = 2$.<br><br><em>Giải thích các đáp án khác:</em><br>• A: Sai vì $R_1$ và $R_3$ độc lập tuyến tính.<br>• C: Sai vì $R_2 = 2R_1$.<br>• D: Sai vì ma trận khác không."
            },
            {
                difficulty: "Trung bình",
                question: "Điều kiện cần và đủ để ma trận vuông $A$ cấp $n$ khả nghịch là:",
                options: [
                    "$A$ có tất cả các phần tử khác 0.",
